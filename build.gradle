buildscript {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		mavenCentral()
	}
	dependencies {
		// Usamos la 1.6-SNAPSHOT que es más estable para 1.20.4
		classpath "net.fabricmc:fabric-loom:1.6-SNAPSHOT"
	}
}

// Reemplazamos el bloque 'plugins {}' por 'apply plugin'
apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.fabricmc.net/" }
	mavenCentral()
}

loom {
	runs {
		client {
			client()
			setConfigName("Fabric Client")
			ideConfigGenerated(true)
			runDir("run")
		}
		server {
			server()
			setConfigName("Fabric Server")
			ideConfigGenerated(true)
			runDir("run")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:1.20.4"
	mappings "net.fabricmc:yarn:1.20.4+build.3:v2"
	
	modImplementation "net.fabricmc:fabric-loader:0.18.6"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.97.0+1.20.4"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}
